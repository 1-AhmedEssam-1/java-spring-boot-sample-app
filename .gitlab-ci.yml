stages:
- build
- test
- package
- publish
variables:
MAVEN_CLI_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
cache:
key: "$CI_COMMIT_REF_SLUG"
paths:
- .m2/repository
build:
stage: build
image: maven:3.9-eclipse-temurin-17
script:
- mvn $MAVEN_CLI_OPTS compile -B
rules:
- if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
- if: '$CI_COMMIT_BRANCH'
test:
stage: test
image: maven:3.9-eclipse-temurin-17
script:
- mvn $MAVEN_CLI_OPTS test -B
artifacts:
when: always
reports:
junit:
- target/surefire-reports/*.xml
rules:
- if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
- if: '$CI_COMMIT_BRANCH'
package:
stage: package
image: maven:3.9-eclipse-temurin-17
script:
- mvn $MAVEN_CLI_OPTS package -DskipTests -B
artifacts:
paths:
- target/*.jar
expire_in: 1 hour
rules:
- if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
